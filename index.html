<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makariy Lomykin | Photography Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        .page-section { display: none; }
        .page-section.active { display: block !important; }
        
        .photo-slot {
            width: 100%;
            min-height: 280px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .placeholder-frame-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="#home" class="nav-brand" id="nav-brand-text">MAKARIY LOMYKIN</a>
            <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-menu" id="nav-menu">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#project1" class="nav-link" id="nav-proj1">01 — Where Light Finds Form</a>
                <a href="#project2" class="nav-link" id="nav-proj2">02 — A Study in Color</a>
                <a href="#project3" class="nav-link" id="nav-proj3">03 — Quiet Observations</a>
                <a href="#project4" class="nav-link" id="nav-proj4">04 — Between the Seen and Unseen</a>
                <a href="#about" class="nav-link">About Me</a>
                <a href="#contact" class="nav-link">Inquiries</a>
            </nav>
        </div>
    </header>

    <main id="app-content">

        <section id="home" class="page-section active">
            <div class="hero-container">
                <div class="hero-header fade-in">
                    <h1 class="artist-name" id="home-artist-name">MAKARIY LOMYKIN</h1>
                    <p class="artist-subtitle" id="home-artist-subtitle">PHOTOGRAPHY PORTFOLIO</p>
                </div>
                <div class="hero-photo-wrapper fade-in">
                    <div class="photo-slot hero-slot" id="hero-slot">
                        <span class="placeholder-frame-text">FEATURED WORK</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="project1" class="page-section">
            <div class="container">
                <header class="project-header">
                    <h1 class="project-title" id="p1-title-heading"></h1>
                    <p class="project-description" id="p1-desc-heading"></p>
                </header>
                <div class="portfolio-grid" id="p1-grid"></div>
            </div>
        </section>

        <section id="project2" class="page-section">
            <div class="container">
                <header class="project-header">
                    <h1 class="project-title" id="p2-title-heading"></h1>
                    <p class="project-description" id="p2-desc-heading"></p>
                </header>
                <div class="portfolio-grid" id="p2-grid"></div>
            </div>
        </section>

        <section id="project3" class="page-section">
            <div class="container">
                <header class="project-header">
                    <h1 class="project-title" id="p3-title-heading"></h1>
                    <p class="project-description" id="p3-desc-heading"></p>
                </header>
                <div class="portfolio-grid" id="p3-grid"></div>
            </div>
        </section>

        <section id="project4" class="page-section">
            <div class="container">
                <header class="project-header">
                    <h1 class="project-title" id="p4-title-heading"></h1>
                    <p class="project-description" id="p4-desc-heading"></p>
                </header>
                <div class="portfolio-grid" id="p4-grid"></div>
            </div>
        </section>

        <section id="about" class="page-section">
            <div class="container">
                <div class="about-grid">
                    <div class="about-text-column">
                        <h1 class="about-name" id="about-artist-name"></h1>
                        <div class="about-story" id="about-story-text"></div>
                    </div>
                    <div class="about-photo-column">
                        <div class="photo-entry">
                            <h3 class="entry-title" id="about-photo-title"></h3>
                            <div class="photo-slot" id="about-portrait-slot">
                                <span class="placeholder-frame-text">PORTRAIT</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact" class="page-section">
            <div class="container">
                <div class="contact-wrapper">
                    <h1 class="contact-main-heading">INQUIRIES</h1>
                    <div class="contact-content">
                        <p class="contact-statement" id="contact-statement-text"></p>
                        
                        <div class="contact-details-grid">
                            <div class="contact-item">
                                <span class="contact-label">EMAIL</span>
                                <a href="" class="contact-value" id="contact-email"></a>
                            </div>
                            <div class="contact-item">
                                <span class="contact-label">PHONE</span>
                                <a href="" class="contact-value" id="contact-phone"></a>
                            </div>
                            <div class="contact-item">
                                <span class="contact-label">LOCATION</span>
                                <span class="contact-value" id="contact-location"></span>
                            </div>
                            <div class="contact-item">
                                <span class="contact-label">INSTAGRAM</span>
                                <a href="" target="_blank" rel="noopener" class="contact-value" id="contact-instagram"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>© <span id="footer-year"></span> <span id="footer-artist-name"></span>. All Rights Reserved.</p>
    </footer>

    <script src="config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('footer-year').textContent = new Date().getFullYear();

            function cleanTitleFromFile(filename) {
                if (!filename) return "Untitled";
                return filename.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
            }

            function populateContent() {
                if (typeof PORTFOLIO_CONFIG === 'undefined') return;

                document.getElementById('nav-brand-text').textContent = PORTFOLIO_CONFIG.artistName;
                document.getElementById('home-artist-name').textContent = PORTFOLIO_CONFIG.artistName;
                document.getElementById('home-artist-subtitle').textContent = PORTFOLIO_CONFIG.subtitle;
                document.getElementById('footer-artist-name').textContent = PORTFOLIO_CONFIG.artistName;

                document.getElementById('nav-proj1').textContent = PORTFOLIO_CONFIG.projects.project1.name;
                document.getElementById('nav-proj2').textContent = PORTFOLIO_CONFIG.projects.project2.name;
                document.getElementById('nav-proj3').textContent = PORTFOLIO_CONFIG.projects.project3.name;
                document.getElementById('nav-proj4').textContent = PORTFOLIO_CONFIG.projects.project4.name;

                // Hero Photo
                const heroSlot = document.getElementById('hero-slot');
                if (PORTFOLIO_CONFIG.featuredHomePhoto) {
                    heroSlot.innerHTML = `<img src="${encodeURIComponent(PORTFOLIO_CONFIG.featuredHomePhoto)}" alt="Featured Photo">`;
                }

                // Project Grids
                ['project1', 'project2', 'project3', 'project4'].forEach((pKey, index) => {
                    const pNum = index + 1;
                    const projData = PORTFOLIO_CONFIG.projects[pKey];
                    
                    document.getElementById(`p${pNum}-title-heading`).textContent = projData.name;
                    document.getElementById(`p${pNum}-desc-heading`).textContent = projData.description;

                    const gridContainer = document.getElementById(`p${pNum}-grid`);
                    gridContainer.innerHTML = '';

                    projData.photos.forEach((photoObj) => {
                        const titleText = cleanTitleFromFile(photoObj.file);
                        const entry = document.createElement('div');
                        entry.className = 'photo-entry';
                        
                        const encodedFileName = photoObj.file ? encodeURIComponent(photoObj.file) : '';

                        entry.innerHTML = `
                            <h3 class="entry-title">${titleText}</h3>
                            <div class="photo-slot">
                                ${photoObj.file ? `<img src="${encodedFileName}" alt="${titleText}" onerror="this.style.display='none';">` : ''}
                                <span class="placeholder-frame-text">${titleText}</span>
                            </div>
                            <p class="entry-subtext">${photoObj.subtext}</p>
                        `;
                        gridContainer.appendChild(entry);
                    });
                });

                // About Me
                document.getElementById('about-artist-name').textContent = PORTFOLIO_CONFIG.about.name;
                document.getElementById('about-photo-title').textContent = PORTFOLIO_CONFIG.about.name;
                document.getElementById('about-story-text').innerHTML = `<p>${PORTFOLIO_CONFIG.about.story}</p>`;
                
                const aboutPortraitSlot = document.getElementById('about-portrait-slot');
                if (PORTFOLIO_CONFIG.aboutPortraitPhoto) {
                    aboutPortraitSlot.innerHTML = `<img src="${encodeURIComponent(PORTFOLIO_CONFIG.aboutPortraitPhoto)}" alt="Makariy Lomykin">`;
                }

                // Contact
                document.getElementById('contact-statement-text').textContent = PORTFOLIO_CONFIG.contact.statement;
                document.getElementById('contact-email').textContent = PORTFOLIO_CONFIG.contact.email;
                document.getElementById('contact-email').href = `mailto:${PORTFOLIO_CONFIG.contact.email}`;
                document.getElementById('contact-phone').textContent = PORTFOLIO_CONFIG.contact.phone;
                document.getElementById('contact-phone').href = `tel:${PORTFOLIO_CONFIG.contact.phone.replace(/[^0-9+]/g, '')}`;
                document.getElementById('contact-location').textContent = PORTFOLIO_CONFIG.contact.location;
                document.getElementById('contact-instagram').textContent = PORTFOLIO_CONFIG.contact.instagram;
                document.getElementById('contact-instagram').href = `https://instagram.com/${PORTFOLIO_CONFIG.contact.instagram.replace('@', '')}`;
            }

            populateContent();

            // ROUTER
            const pageSections = document.querySelectorAll('.page-section');
            const mobileToggle = document.getElementById('mobile-toggle');
            const navMenu = document.getElementById('nav-menu');

            function handleRoute() {
                let hash = window.location.hash || '#home';
                let targetId = hash.replace('#', '');

                let targetSection = document.getElementById(targetId);
                if (!targetSection) {
                    targetId = 'home';
                }

                pageSections.forEach(section => {
                    if (section.id === targetId) {
                        section.classList.add('active');
                        section.style.setProperty('display', 'block', 'important');
                    } else {
                        section.classList.remove('active');
                        section.style.setProperty('display', 'none', 'important');
                    }
                });

                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('href') === '#' + targetId) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (navMenu) navMenu.classList.remove('open');
            }

            window.addEventListener('hashchange', handleRoute);
            handleRoute();

            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    navMenu.classList.toggle('open');
                });
            }
        });
    </script>
</body>
</html>
